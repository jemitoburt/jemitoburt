name: Update profile stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          token = os.environ["GH_TOKEN"]
          owner = os.environ["GH_OWNER"]
          headers = {"Accept": "application/vnd.github+json", "Authorization": f"Bearer {token}"}

          def get(path):
              request = Request(f"https://api.github.com{path}", headers=headers)
              with urlopen(request) as response:
                  return json.load(response)

          user = get(f"/users/{owner}")
          repos = get(f"/users/{owner}/repos?per_page=100&type=owner")
          stars = sum(repo["stargazers_count"] for repo in repos)

          query = {
              "query": "query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions}}}}",
              "variables": {"login": owner},
          }
          request = Request(
              "https://api.github.com/graphql",
              data=json.dumps(query).encode(),
              headers={**headers, "Content-Type": "application/json"},
          )
          with urlopen(request) as response:
              contributions = json.load(response)["data"]["user"]["contributionsCollection"]["contributionCalendar"]["totalContributions"]

          metrics = [
              ("PUBLIC REPOSITORIES", user["public_repos"]),
              ("CONTRIBUTIONS / YEAR", contributions),
              ("STARS EARNED", stars),
              ("FOLLOWERS", user["followers"]),
          ]
          cards = []
          for index, (label, value) in enumerate(metrics):
              x = 24 + index * 137
              cards.append(f'<text x="{x}" y="59" class="value">{html.escape(str(value))}</text>')
              cards.append(f'<text x="{x}" y="82" class="label">{html.escape(label)}</text>')

          svg = f'''<svg width="576" height="108" viewBox="0 0 576 108" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub activity statistics for {html.escape(owner)}">
          <style>
            .bg {{ fill: #0d1117; }}
            .line {{ stroke: #30363d; }}
            .value {{ fill: #f0f6fc; font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }}
            .label {{ fill: #8b949e; font: 600 9px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .7px; }}
            .title {{ fill: #58a6ff; font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.2px; }}
          </style>
          <rect width="576" height="108" rx="8" class="bg"/>
          <rect x=".5" y=".5" width="575" height="107" rx="7.5" fill="none" class="line"/>
          <text x="24" y="24" class="title">GITHUB SIGNAL · {html.escape(owner.upper())}</text>
          <line x1="24" y1="34" x2="552" y2="34" class="line"/>
          {''.join(cards)}
          </svg>'''
          Path("profile/stats.svg").write_text(svg.strip() + "\n", encoding="utf-8")
          PY

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile stats"
          fi
          card_commit=$(git rev-parse HEAD)
          python3 - <<PY
          import re
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          replacement = "https://raw.githubusercontent.com/jemitoburt/jemitoburt/" + "${card_commit}" + "/profile/stats.svg"
          text, count = re.subn(
              r"https://raw\.githubusercontent\.com/jemitoburt/jemitoburt/[^\" ]+/profile/stats\.svg",
              replacement,
              text,
          )
          if count != 1:
              raise SystemExit(f"expected one stats image URL, found {count}")
          path.write_text(text, encoding="utf-8")
          PY
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: pin profile stats image"
          fi
          git push
